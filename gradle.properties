# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# The native file-watcher cannot start under this machine's sandbox (error 5),
# so fall back to polling.
org.gradle.vfs.watch=false

# ---------------------------------------------------------------------------
# Minecraft / Forge
#
# Target is 47.4.10, the Forge *recommended* build for 1.20.1. mods.toml declares
# versionRange [47,) so the same jar also loads on newer 47.x builds such as the
# current latest, 47.4.23.
#
# The toolchain is Java 17 (what 1.20.1 targets), so the produced jar runs on
# Java 17 and on Java 21 alike.
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1

# ---------------------------------------------------------------------------
# Mod metadata (${...} placeholders are expanded into mods.toml / pack.mcmeta)
# ---------------------------------------------------------------------------
mod_id=globalshop
mod_name=GlobalShop
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.globalshop
mod_authors=GlobalShop
mod_description=A server-authoritative shared marketplace for every player on the server, with a built-in, swappable economy.
