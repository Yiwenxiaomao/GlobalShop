# GlobalShop access transformer.
#
# Kept intentionally empty: the mod only touches public Minecraft/Forge API, and
# an empty file is a valid AT file. Add entries here only if you need to widen
# access to a Minecraft member, one entry per line, for example:
#
#   public net.minecraft.world.level.block.Block someField
#
# Then uncomment the accessTransformer line in build.gradle.
